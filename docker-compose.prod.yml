services:
  postgres:
    image: postgres:16-alpine
    container_name: nati-lotto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-nati_lotto}
    ports:
      - "5432:5432"
    volumes:
      - nati_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nati_lotto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: nati-lotto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nati_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nati-lotto-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nati_lotto?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-nati-lotto-jwt-key-change-in-production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      MOCK_MODE: "true"
      PAYMENT_PROVIDER: MOCK
      SMS_PROVIDER: MOCK
      EMAIL_PROVIDER: MOCK
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nati_postgres_data:
  nati_redis_data:
